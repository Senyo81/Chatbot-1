<!DOCTYPE html>
<html>
<head>
    <title>Smartbot</title>
    <style>
        body { font-family: Arial; background: #f0f2f5; padding: 30px; }
        #chatbox { width: 100%; max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; }
        #messages { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .bubble { padding: 12px 16px; border-radius: 20px; max-width: 75%; }
        .user { background-color: #d1e7ff; align-self: flex-end; }
        .bot { background-color: #f1f1f1; align-self: flex-start; }
        input { width: 80%; padding: 10px; }
        button { padding: 10px; }
    </style>
</head>
<body>
    <div id="chatbox">
        <h2>🤖 Smartbot</h2>
        <div id="messages"></div>
        <input type="text" id="input" placeholder="Ask me anything..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById("input");
            const userMsg = inputField.value.trim();
            if (!userMsg) return;

            const msgDiv = document.getElementById("messages");
            msgDiv.innerHTML += `<div class='bubble user'>${userMsg}</div>`;
            inputField.value = "";

            fetch("/get", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ msg: userMsg })
            })
            .then(res => res.json())
            .then(data => {
                msgDiv.innerHTML += `<div class='bubble bot'>${data.response}</div>`;
            });
        }
    </script>
</body>
</html>
